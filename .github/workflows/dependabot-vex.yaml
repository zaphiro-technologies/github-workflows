name: Generate VEX from Dependabot dismissals

on:
  workflow_dispatch:
    inputs:
      product-purls:
        description: Newline-separated PURLs for the products covered by the VEX statements
        required: false
        default: ""
        type: string
      image-name:
        description: GHCR image name used when product-purls is omitted; defaults to the repository name
        required: false
        default: ""
        type: string
      vex-path:
        description: Path of the repository-owned OpenVEX document
        required: false
        default: .vex/dependabot.openvex.json
        type: string
      dismissal-ledger-path:
        description: Path of the repository-owned historical Dependabot dismissal ledger
        required: false
        default: .vex/dependabot-dismissals.json
        type: string
      base-branch:
        description: Branch from which to create or update the candidate PR
        required: false
        default: main
        type: string
  workflow_call:
    inputs:
      product-purls:
        description: Newline-separated PURLs for the products covered by the VEX statements
        required: false
        default: ""
        type: string
      image-name:
        description: GHCR image name used when product-purls is omitted; defaults to the repository name
        required: false
        default: ""
        type: string
      vex-path:
        description: Path of the repository-owned OpenVEX document
        required: false
        default: .vex/dependabot.openvex.json
        type: string
      dismissal-ledger-path:
        description: Path of the repository-owned historical Dependabot dismissal ledger
        required: false
        default: .vex/dependabot-dismissals.json
        type: string
      base-branch:
        description: Branch from which to create or update the candidate PR
        required: false
        default: main
        type: string
    secrets:
      APP_ID:
        required: true
      APP_SECRET:
        required: true

permissions:
  contents: read
  pull-requests: read
  vulnerability-alerts: read

concurrency:
  group: ${{ github.repository }}-dependabot-vex-${{ inputs.vex-path }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover reviewed VEX candidates
    runs-on: ubuntu-latest
    outputs:
      vulnerability-ids: ${{ steps.vex.outputs.vulnerability-ids }}
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.base-branch }}

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_SECRET }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-vulnerability-alerts: write

      - name: Generate Dependabot VEX candidates
        id: vex
        uses: zaphiro-technologies/dependabot-vex-action@initial-version
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          product-purls: ${{ inputs.product-purls }}
          image-name: ${{ inputs.image-name }}
          vex-path: ${{ inputs.vex-path }}
          dismissal-ledger-path: ${{ inputs.dismissal-ledger-path }}
          base-branch: ${{ inputs.base-branch }}

  generate:
    name: Generate VEX candidate (${{ matrix.vulnerability-id }})
    needs: discover
    if: ${{ needs.discover.outputs.vulnerability-ids != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vulnerability-id: ${{ fromJSON(needs.discover.outputs.vulnerability-ids) }}
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.base-branch }}

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_SECRET }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-vulnerability-alerts: write

      - name: Generate Dependabot VEX candidate
        id: vex
        uses: zaphiro-technologies/dependabot-vex-action@initial-version
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          product-purls: ${{ inputs.product-purls }}
          image-name: ${{ inputs.image-name }}
          vex-path: ${{ inputs.vex-path }}
          dismissal-ledger-path: ${{ inputs.dismissal-ledger-path }}
          base-branch: ${{ inputs.base-branch }}
          vulnerability-id: ${{ matrix.vulnerability-id }}

      - name: Create VEX pull request
        if: ${{ steps.vex.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: ${{ inputs.base-branch }}
          branch: ${{ steps.vex.outputs.candidate-branch }}
          delete-branch: true
          commit-message: "security: update Dependabot VEX statements"
          title: ${{ steps.vex.outputs.pull-request-title }}
          body: ${{ steps.vex.outputs.pull-request-body }}
          labels: security
