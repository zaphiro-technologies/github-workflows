name: License Management

concurrency:
  group: ${{github.repository}}-${{ github.ref_name }}-license
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_call:
    inputs:
      skip-dependency:
        required: false
        default: false
        type: boolean
        description: True to skip license dependency check
      skip-fix:
        required: false
        default: true
        type: boolean
        description: True to skip license header fix
      license-config-path:
        required: false
        default: ".github/config/.licenserc.yaml"
        type: string
        description: Path to the license-eye configuration file.
      repositories:
        required: false
        type: string
        default: ""
        description: Comma or newline-separated list of repositories to grant access to during the golang build.
jobs:
  license:
    name: Check licenses
    runs-on: ubuntu-latest
    #if: ${{ github.event.pull_request.draft == false }}
    env:
      GOPRIVATE: github.com/zaphiro-technologies/*
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_SECRET }}
          repositories: github-workflows,${{ github.event.repository.name }}${{ inputs.repositories && format(',{0}', inputs.repositories) || '' }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: ${{github.event.pull_request.head.ref}}
          repository: ${{github.event.pull_request.head.repo.full_name}}
      - name: Fix License Header
        if: ${{ ! inputs.skip-fix || inputs.skip-fix == '' }}
        uses: apache/skywalking-eyes/header@v0.8.0
        with:
          config: ${{ inputs.license-config-path || '.github/config/.licenserc.yaml' }}
          mode: fix
      - name: Apply Changes
        if: ${{ ! inputs.skip-fix || inputs.skip-fix == '' }}
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_user_name: License Bot
          commit_user_email: bot@zaphiro.ch
          commit_message: "Automatic application of license header"
      - run: git config --global "url.https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/.insteadOf" "https://github.com/"
      - if: ${{ (!inputs.skip-dependency || inputs.skip-dependency == '') }}
        name: Check licenses
        uses: zaphiro-technologies/license-checker@license-action-test
        with:
          config: ${{ inputs.license-config-path || '.github/config/.licenserc.yaml' }}
          token: ${{ github.token }}
          log: debug
