name: Publish new release

concurrency:
  group: ${{ github.repository }}-new-release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create without the leading v (empty computes the next patch)
        required: false
        type: string
        default: ""
      dependency-scan:
        description: Generate source dependency SBOM and vulnerability evidence
        required: false
        type: boolean
        default: true
      vex-path:
        description: Optional repository-owned VEX document used by source vulnerability scans
        required: false
        type: string
        default: .vex/dependabot.openvex.json
      dependency-scan-skip-dirs:
        description: Comma-separated directories excluded from source dependency scanning
        required: false
        type: string
        default: vendor,.github,node_modules
  workflow_call:
    inputs:
      tag:
        description: Tag to create without the leading v (empty computes the next patch)
        required: false
        type: string
        default: ""
      dependency-scan:
        description: Generate source dependency SBOM and vulnerability evidence
        required: false
        type: boolean
        default: true
      vex-path:
        description: Optional repository-owned VEX document used by source vulnerability scans
        required: false
        type: string
        default: .vex/dependabot.openvex.json
      dependency-scan-skip-dirs:
        description: Comma-separated directories excluded from source dependency scanning
        required: false
        type: string
        default: vendor,.github,node_modules
    outputs:
      release-tag:
        description: Published release tag without the leading v
        value: ${{ jobs.prepare-release.outputs.tag }}
    secrets:
      APP_ID:
        required: true
      APP_SECRET:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  prepare-release:
    name: Prepare release
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      revision: ${{ steps.create-tag.outputs.revision }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_SECRET }}
          permission-contents: write
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0
      - name: Compute and validate version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          regex='^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)?$'

          if [[ -n "$REQUESTED_TAG" ]]; then
            NEWTAG="$REQUESTED_TAG"
          else
            PREVTAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
            PREVVERSION="${PREVTAG#v}"
            PREVVERSION="${PREVVERSION%%[-+]*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$PREVVERSION"
            NEWTAG="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          if [[ ! "$NEWTAG" =~ $regex ]]; then
            echo "$NEWTAG is not a valid SemVer" >&2
            exit 1
          fi

          if git rev-parse --verify "refs/tags/v${NEWTAG}" >/dev/null 2>&1; then
            echo "Tag v${NEWTAG} already exists" >&2
            exit 1
          fi

          echo "tag=$NEWTAG" >> "$GITHUB_OUTPUT"
      - name: Check release does not already exist
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASE_TAG: v${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi
      - name: Update version using make
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: make release TAG="$RELEASE_TAG"
      - name: Commit version changes
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'Bot'
          git config user.email 'bot@zaphiro.ch'
          git commit -am "Automated tag changes [dependabot skip]" || echo "No changes to commit"
          git push origin "HEAD:$RELEASE_BRANCH"
      - name: Create release tag
        id: create-tag
        env:
          RELEASE_TAG: v${{ steps.version.outputs.tag }}
        run: |
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  wait-for-docker-build:
    name: Wait for tagged Docker build
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_SECRET }}
          permission-actions: read
          permission-contents: read
      - name: Wait for Docker workflow
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASE_TAG: v${{ needs.prepare-release.outputs.tag }}
          RELEASE_REVISION: ${{ needs.prepare-release.outputs.revision }}
        run: |
          set -euo pipefail
          run_id=""

          for attempt in {1..120}; do
            runs=$(gh api \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/docker.yaml/runs?event=push&per_page=100")
            run_id=$(jq -r \
              --arg tag "$RELEASE_TAG" \
              --arg revision "$RELEASE_REVISION" \
              '[.workflow_runs[] | select(.head_branch == $tag and .head_sha == $revision)] | sort_by(.created_at) | last | .id // empty' \
              <<< "$runs")

            if [[ -n "$run_id" ]]; then
              run=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
              status=$(jq -r '.status' <<< "$run")
              conclusion=$(jq -r '.conclusion // empty' <<< "$run")
              run_url=$(jq -r '.html_url' <<< "$run")
              echo "Docker workflow: $run_url ($status${conclusion:+, $conclusion})"

              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "Tagged Docker workflow did not succeed; inspect the build and vulnerability jobs" >&2
                  exit 1
                fi
                exit 0
              fi
            else
              echo "Waiting for the Docker workflow for $RELEASE_TAG"
            fi

            sleep 15
          done

          echo "Timed out waiting for the Docker workflow for $RELEASE_TAG" >&2
          exit 1

  assemble-evidence:
    name: Assemble source evidence and draft release
    needs:
      - prepare-release
      - wait-for-docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_SECRET }}
          permission-contents: write
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/v${{ needs.prepare-release.outputs.tag }}
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0
      - name: Generate application dependency SBOM
        if: ${{ inputs.dependency-scan }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: ${{ inputs.dependency-scan-skip-dirs || 'vendor,.github,node_modules' }}
          format: cyclonedx
          output: application-dependency-sbom.cdx.json
          exit-code: "0"
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true
      - name: Generate application dependency vulnerability evidence
        if: ${{ inputs.dependency-scan }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: ${{ inputs.dependency-scan-skip-dirs || 'vendor,.github,node_modules' }}
          scanners: vuln
          format: json
          output: application-dependency-vulnerability.json
          exit-code: "0"
        env:
          TRIVY_VEX: ${{ hashFiles(inputs.vex-path) != '' && inputs.vex-path || '' }}
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true
      - name: Enforce application dependency security threshold
        if: ${{ inputs.dependency-scan }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: ${{ inputs.dependency-scan-skip-dirs || 'vendor,.github,node_modules' }}
          scanners: vuln,secret,misconfig
          exit-code: "1"
          severity: MEDIUM,HIGH,CRITICAL
          skip-setup-trivy: true
        env:
          TRIVY_VEX: ${{ hashFiles(inputs.vex-path) != '' && inputs.vex-path || '' }}
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true
      - name: Create release manifest and checksums
        env:
          RELEASE_TAG: v${{ needs.prepare-release.outputs.tag }}
          DEPENDENCY_SCAN: ${{ inputs.dependency-scan }}
        run: |
          set -euo pipefail
          SOURCE_REVISION=$(git rev-parse HEAD)
          DEPENDENCY_SBOM_SHA=""
          DEPENDENCY_VULN_SHA=""
          if [[ "$DEPENDENCY_SCAN" == "true" ]]; then
            DEPENDENCY_SBOM_SHA=$(sha256sum application-dependency-sbom.cdx.json | cut -d' ' -f1)
            DEPENDENCY_VULN_SHA=$(sha256sum application-dependency-vulnerability.json | cut -d' ' -f1)
          fi

          jq -n \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_revision "$SOURCE_REVISION" \
            --arg workflow_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg dependency_sbom_sha "$DEPENDENCY_SBOM_SHA" \
            --arg dependency_vulnerability_sha "$DEPENDENCY_VULN_SHA" \
            --arg dependency_scan "$DEPENDENCY_SCAN" \
            '{schema_version: 1, release_tag: $release_tag, source_revision: $source_revision, workflow_run: $workflow_run, evidence: {application_dependency_scan: ($dependency_scan == "true"), application_dependency_sbom_sha256: $dependency_sbom_sha, application_dependency_vulnerability_sha256: $dependency_vulnerability_sha}}' \
            > release-manifest.json

          checksum_files=(release-manifest.json)
          if [[ "$DEPENDENCY_SCAN" == "true" ]]; then
            checksum_files+=(application-dependency-sbom.cdx.json application-dependency-vulnerability.json)
          fi
          sha256sum "${checksum_files[@]}" > checksums.txt
      - name: Upload release evidence artifact
        if: ${{ inputs.dependency-scan }}
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ needs.prepare-release.outputs.tag }}
          path: |
            application-dependency-sbom.cdx.json
            application-dependency-vulnerability.json
            release-manifest.json
            checksums.txt
          if-no-files-found: error
          retention-days: 20
      - name: Create draft release and attach evidence
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASE_TAG: v${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Release $RELEASE_TAG" \
              --generate-notes \
              --draft
          fi

          assets=(release-manifest.json checksums.txt)
          if [[ "${{ inputs.dependency-scan }}" == "true" ]]; then
            assets+=(application-dependency-sbom.cdx.json application-dependency-vulnerability.json)
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"

  publish-release:
    name: Publish immutable release
    needs:
      - prepare-release
      - assemble-evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_SECRET }}
          permission-contents: write
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASE_TAG: v${{ needs.prepare-release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
