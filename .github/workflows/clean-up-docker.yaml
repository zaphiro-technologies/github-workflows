name: Clean up Docker Images on PR closure

concurrency:
  group: ${{ github.repository }}-${{ inputs.image-name || github.event.repository.name }}-docker-cleanup
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      image-name:
        required: false
        description: Override default image name which is the repo name
        type: string

jobs:
  purge-image:
    name: Delete image from ghcr.io
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete PR image and attached OCI artifacts
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          owner: ${{ github.repository_owner }}
          package: ${{ inputs.image-name || github.event.repository.name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-tags: pr-${{ github.event.pull_request.number }}
          delete-orphaned-images: true
