name: Golang Lint & Test

concurrency:
  group: ${{github.repository}}-${{ github.ref_name }}-go
  cancel-in-progress: true

env:
  TRIVY_DISABLE_VEX_NOTICE: "true"

# Permissions needed
# permissions:
#   # Give the default GITHUB_TOKEN write permission to commit and push the
#   # updated CHANGELOG back to the repository.
#   # https://github.blog/changelog/2023-02-02-github-actions-updating-the-default-github_token-permissions-to-read-only/
#   contents: write

on:
  workflow_call:
    inputs:
      alert-threshold-benchmark:
        required: false
        default: 150%
        type: string
        description: Percent that will trigger benchmark alert
      skip-benchmark:
        required: false
        default: false
        type: boolean
        description: True to skip benchmark exec
      code-scan:
        required: false
        default: true
        type: boolean
        description: False to skip code-scan exec
      vulnerability-scan:
        required: false
        default: true
        type: boolean
        description: False to skip vulnerability-scan exec
      vex-path:
        required: false
        default: .vex/dependabot.openvex.json
        type: string
        description: Optional repository-owned VEX document used by filesystem scans
      vulnerability-scan-skip-dirs:
        required: false
        default: "vendor,.github"
        type: string
        description: Comma separated list of directories where vulnerability check is skipped
      pull-dvc-datasets:
        required: false
        default: false
        type: boolean
        description: True to install and configure dvc
      repositories:
        required: false
        type: string
        default: ""
        description: Comma or newline-separated list of repositories to grant access to during the golang build.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      files_changed: ${{ steps.filter.outputs.go == 'true' || steps.filter.outputs.scripts == 'true' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2 # To retrieve the preceding commit.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: shell
          filters: |
            scripts:
              - '.golangci.yaml'
              - 'Makefile'
              - '.github/workflows/golang.*'
              - '**/*.sql'
              - '.docker/*.yml'
              - '.docker/*.yaml'
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
  lint:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ needs.changes.outputs.files_changed == 'true' && github.event.pull_request }}
    env:
      GOPRIVATE: github.com/zaphiro-technologies/*
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_SECRET }}
          repositories: ${{ github.event.repository.name }}${{ inputs.repositories && format(',{0}', inputs.repositories) || '' }}
          permission-contents: write
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{github.event.pull_request.head.ref}} # Can't commit on detached PR merge commit, so this checkouts the branch
          token: ${{ steps.generate-token.outputs.token }}
      - run: git config --global "url.https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/.insteadOf" "https://github.com/"
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Golines
        run: |
          go install github.com/segmentio/golines@latest
          golines . -w
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          args: --fix
          version: latest
      - name: Commit golines & golangci-lint changes
        run: |
          git config --global user.name 'Bot'
          git config --global user.email 'bot@zaphiro.ch'
          git commit -am "Automated lint fixes [dependabot skip]" || echo "No changes to commit"
          git push
  test:
    needs: changes
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/zaphiro-technologies/*
    if: ${{ needs.changes.outputs.files_changed == 'true' }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_SECRET }}
          repositories: ${{ github.event.repository.name }}${{ inputs.repositories && format(',{0}', inputs.repositories) || '' }}
          permission-contents: read
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Configure AWS Credentials
        if: ${{ inputs.pull-dvc-datasets }}
        id: creds
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: eu-south-1
          role-to-assume: arn:aws:iam::058264335177:role/zaphiro-github-role-demo
          output-credentials: true
      - name: Install DVC
        if: ${{ inputs.pull-dvc-datasets }}
        run: |
          pipx install 'dvc[s3]==3.67.0'
          # sqltrie 0.11.2 uses a private API removed in pygtrie 2.6.
          pipx runpip dvc install 'pygtrie<2.6'
      - name: Set-up git credentials for dvc
        if: ${{ inputs.pull-dvc-datasets }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh auth setup-git
          git config --global credential.helper '!/usr/bin/gh auth git-credential'
      - name: Pull DVC Data
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        if: ${{ inputs.pull-dvc-datasets }}
        run: dvc pull -v --allow-missing
      - run: git config --global "url.https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/.insteadOf" "https://github.com/"
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install gcov2lcov
        run: |
          go install github.com/jandelgado/gcov2lcov@latest
      # We Login in GHCR to retrieve owned private images used in docker-compose
      # This requires to set in the package settings read permission for the
      # repository where the golang ci is running
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        run: |
          make ci-test
      - name: SonarCloud Code Scan
        if: ${{ inputs.code-scan }}
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  benchmark:
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.files_changed == 'true' && ! inputs.skip-benchmark}}
    env:
      GOPRIVATE: github.com/zaphiro-technologies/*
      GOTOOLCHAIN: local
      COMPOSE_PROJECT_NAME: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_SECRET }}
          repositories: ${{ github.event.repository.name }}${{ inputs.repositories && format(',{0}', inputs.repositories) || '' }}
          permission-contents: read
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: git config --global url.https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/.insteadOf https://github.com/
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # We Login in GHCR to retrieve owned private images used in docker-compose
      # This requires to set in the package settings read permission for the
      # repository where the golang ci is running
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare same-runner baseline
        id: benchmark-baseline
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BENCHMARK_RESULTS: ${{ runner.temp }}/go-benchmark-results
        run: |
          set -euo pipefail
          echo "BENCHMARK_RESULTS=$BENCHMARK_RESULTS" >> "$GITHUB_ENV"
          mkdir -p "$BENCHMARK_RESULTS"

          # Only remove Compose resources owned by this benchmark job.
          cat > "$RUNNER_TEMP/cleanup-go-benchmark.sh" <<'SH'
          set -euo pipefail
          docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" \
            | xargs -r docker rm --force --volumes
          docker volume ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" \
            | xargs -r docker volume rm
          docker network ls -q --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" \
            | xargs -r docker network rm
          SH

          # Pushes compare with the pre-push commit; manual/tag runs use HEAD^.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git rev-parse --verify HEAD^ 2>/dev/null || true)
          fi
          if [[ -n "$BASE_SHA" ]]; then
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BASE_SHA"
            fi
            base_dir="$RUNNER_TEMP/go-benchmark-base"
            git worktree add --detach "$base_dir" "$BASE_SHA"
            echo "directory=$base_dir" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No parent commit; recording initial benchmark results"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          {
            printf 'candidate=%s\nbase=%s\n' "$(git rev-parse HEAD)" "$BASE_SHA"
            go version
            lscpu
          } > "$BENCHMARK_RESULTS/environment.txt"
      - name: Run baseline benchmark
        if: ${{ steps.benchmark-baseline.outputs.sha != '' }}
        working-directory: ${{ steps.benchmark-baseline.outputs.directory }}
        shell: bash
        run: |
          set -o pipefail
          make ci-bench 2>&1 | tee "$BENCHMARK_RESULTS/base.txt"
      - name: Clean baseline services
        if: ${{ always() && steps.benchmark-baseline.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/cleanup-go-benchmark.sh"
      - name: Run candidate benchmark
        shell: bash
        run: |
          set -o pipefail
          make ci-bench 2>&1 | tee "$BENCHMARK_RESULTS/head.txt"
      - name: Clean candidate services
        if: ${{ always() && steps.benchmark-baseline.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/cleanup-go-benchmark.sh"
      # Inline because reusable workflows execute in the caller's checkout.
      - name: Compare benchmark results
        id: compare-benchmarks
        shell: bash
        env:
          BASE_SHA: ${{ steps.benchmark-baseline.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
          ALERT_THRESHOLD: ${{ inputs.alert-threshold-benchmark }}
        run: |
          python3 <<'PY'
          import math
          import os
          import re
          import statistics
          from pathlib import Path

          # Go's standard throughput metric has the opposite direction to costs.
          METRICS = {"ns/op": False, "B/op": False, "allocs/op": False, "MB/s": True}

          def parse_results(text):
              package = ""
              samples = {}
              for line in text.splitlines():
                  if line.startswith("pkg: "):
                      package = line[5:].strip()
                  fields = line.split()
                  if len(fields) < 4 or not fields[0].startswith("Benchmark") or not fields[1].isdigit():
                      continue
                  name = re.sub(r"-\d+$", "", fields[0])
                  for raw, unit in zip(fields[2::2], fields[3::2]):
                      if unit not in METRICS:
                          continue
                      value = float(raw)
                      if not math.isfinite(value) or value < 0:
                          raise ValueError(f"Invalid {unit} value for {name}: {raw}")
                      samples.setdefault((package, name, unit), []).append(value)
              return {key: statistics.median(values) for key, values in samples.items()}

          def parse_threshold(text):
              if not text.endswith("%"):
                  raise ValueError("Benchmark threshold must be a percentage, such as 150%")
              threshold = float(text[:-1]) / 100
              if not math.isfinite(threshold) or threshold < 1:
                  raise ValueError("Benchmark threshold must be at least 100%")
              return threshold

          def compare_results(base, head, threshold):
              rows = []
              regressions = []
              for key, current in sorted(head.items()):
                  previous = base.get(key)
                  ratio = None
                  if previous is not None:
                      numerator, denominator = (previous, current) if METRICS[key[2]] else (current, previous)
                      ratio = numerator / denominator if denominator else (math.inf if numerator else 1)
                  regression = ratio is not None and ratio > threshold
                  rows.append((key, previous, current, ratio, regression))
                  if regression:
                      regressions.append(key)
              return rows, regressions

          def main():
              directory = Path(os.environ["BENCHMARK_RESULTS"])
              base_file = directory / "base.txt"
              base = parse_results(base_file.read_text()) if base_file.exists() else {}
              head = parse_results((directory / "head.txt").read_text())
              rows, regressions = compare_results(base, head, parse_threshold(os.environ["ALERT_THRESHOLD"]))
              report = [
                  "## Go benchmark comparison",
                  "",
                  f"Base: `{os.environ['BASE_SHA'] or 'none'}`; candidate: `{os.environ['HEAD_SHA']}`.",
                  f"Same runner and Go toolchain; regression threshold: {os.environ['ALERT_THRESHOLD']}.",
                  "Repeated samples use the median. Ratios above the threshold are worse, including throughput decreases.",
                  "",
                  "| Benchmark | Metric | Base | Candidate | Regression ratio | Status |",
                  "| --- | --- | ---: | ---: | ---: | --- |",
              ]
              for (package, name, unit), previous, current, ratio, regression in rows:
                  label = f"{package}: {name}".replace("|", r"\|")
                  old = "—" if previous is None else f"{previous:g}"
                  relative = "—" if ratio is None else f"{ratio:.2f}x"
                  status = "REGRESSION" if regression else ("new" if previous is None else "pass")
                  report.append(f"| `{label}` | {unit} | {old} | {current:g} | {relative} | {status} |")
                  if regression:
                      print(f"::error::{label} ({unit}): {old} -> {current:g}, {relative} worse")
              compared = len(base.keys() & head.keys())
              removed = len(base.keys() - head.keys())
              report.extend(["", f"{compared} metrics compared; {len(head) - compared} new; {removed} removed."])
              if not compared:
                  print("::notice::No comparable benchmark metrics; results are recorded without a regression gate")
              content = "\n".join(report) + "\n"
              (directory / "comparison.md").write_text(content)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(content)
              return bool(regressions)

          if __name__ == "__main__":
              raise SystemExit(main())
          PY
      - name: Upload benchmark comparison
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-comparison
          # Command logs stay in the console, where GitHub masks secrets.
          path: |
            ${{ env.BENCHMARK_RESULTS }}/comparison.md
            ${{ env.BENCHMARK_RESULTS }}/environment.txt
          if-no-files-found: ignore
          retention-days: 400
  vulnerability:
    needs: changes
    if: ${{ inputs.vulnerability-scan}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run Trivy vulnerability scanner (for summary)
        # trivy-action v0.35.0 (safe version)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: ${{ inputs.vulnerability-scan-skip-dirs }}
          scanners: "vuln,secret,misconfig"
          hide-progress: true
          output: trivy.txt
        env:
          TRIVY_VEX: ${{ hashFiles(inputs.vex-path) != '' && inputs.vex-path || '' }}
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true
      - name: Publish Trivy Output to Summary
        run: |
          if [[ -s trivy.txt ]]; then
            {
              echo "### Trivy Security Output"
              echo ""
              echo '```text'
              cat trivy.txt
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
          fi
      # this comes as last or scan results won't be uploaded
      - name: Run Trivy vulnerability scanner (security treshold)
        # trivy-action v0.35.0 (safe version)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: ${{ inputs.vulnerability-scan-skip-dirs }}
          scanners: "vuln,secret,misconfig"
          exit-code: "1"
          severity: MEDIUM,HIGH,CRITICAL
          # On a subsequent call to the action we know trivy is already installed so can skip this
          skip-setup-trivy: true
        env:
          TRIVY_VEX: ${{ hashFiles(inputs.vex-path) != '' && inputs.vex-path || '' }}
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true
