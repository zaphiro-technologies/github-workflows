name: Docker Build

concurrency:
  group: ${{github.repository}}-${{ github.ref_name }}-docker-${{ inputs.image-name || 'default' }}
  cancel-in-progress: true

env:
  TRIVY_DISABLE_VEX_NOTICE: "true"

on:
  workflow_call:
    secrets:
      BUILD_SECRET:
        required: false
      DOCKER_USER:
        required: false
      DOCKER_PASSWORD:
        required: false
      APP_ID:
        required: true
      APP_SECRET:
        required: true
    inputs:
      image-name:
        required: false
        description: Override default image name which is the repo name
        type: string
      annotations:
        required: false
        description: Newline-separated OCI image annotations (for example, org.opencontainers.image.description=My image)
        type: string
        default: ""
      docker-context:
        required: false
        description: Docker context path
        type: string
        default: ./
      docker-file:
        required: false
        description: Dockerfile path
        type: string
        default: .docker/Dockerfile
      platforms:
        required: false
        description: Platform to build for, comma separated
        type: string
        default: linux/amd64,linux/arm64
      vulnerability-scan:
        required: false
        default: true
        type: boolean
        description: False to skip vulnerability-scan
      go-cache:
        required: false
        default: false
        type: boolean
        description: Use go caching mechanism
      language-cache:
        required: false
        type: string
        default: ""
        description: Use caching mechanism for a given language
      repositories:
        required: false
        type: string
        default: ""
        description: Comma or newline-separated list of additional repositories needed for Docker build (e.g., private dependencies)
      image-sbom:
        required: false
        default: true
        type: boolean
        description: Attach a BuildKit SBOM attestation to the pushed image
      vex-attestation:
        required: false
        default: true
        type: boolean
        description: Attach the unsigned repository-owned OpenVEX document when it exists
      vex-path:
        required: false
        default: .vex/dependabot.openvex.json
        type: string
        description: Repository-owned OpenVEX document to attach to the image
      provenance:
        required: false
        default: true
        type: boolean
        description: Attach max-level BuildKit provenance to the pushed image
      sbom-scan-stage:
        required: false
        default: false
        type: boolean
        description: Request SBOM coverage for declared Dockerfile build stages
      sbom-scan-context:
        required: false
        default: false
        type: boolean
        description: Request SBOM coverage for the declared Docker build context
      fail-on-vulnerability:
        required: false
        default: true
        type: boolean
        description: Fail the workflow when the image scan finds configured severities

jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && !github.event.pull_request.draft) || contains(github.event.pull_request.labels.*.name, 'docker') }}
    steps:
      - run: |
          echo "docker build is required"
  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      image: ${{ steps.image-name.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ steps.image-ref.outputs.ref }}
      platforms: ${{ inputs.platforms }}
      vex-attached: ${{ steps.attach-vex.outcome == 'success' }}
    env:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_SECRET }}
          repositories: ${{ github.event.repository.name }}${{ inputs.repositories && format(',{0}', inputs.repositories) || '' }}
          permission-contents: read
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: ${{ github.ref }}
      - name: Run pre-build
        env:
          BUILD_SECRET: ${{ secrets.BUILD_SECRET }}
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          if test -f "Makefile"; then
              make ci-pre-build
          fi
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: ghcr.io/${{github.repository_owner}}/${{ inputs.image-name || github.event.repository.name }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=edge,branch=main,priority=700
            type=ref,event=branch,priority=800
            type=ref,event=pr,priority=800
            type=semver,pattern={{version}},priority=900
            type=semver,pattern={{major}}.{{minor}},priority=900
            type=semver,pattern={{major}},priority=900
          annotations: ${{ inputs.annotations }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - name: Go Build Cache for Docker
        id: cache-go
        if: ${{ inputs.go-cache || inputs.language-cache == 'go' }}
        uses: actions/cache@v6.1.0
        with:
          path: go-build-cache
          key: ${{ runner.os }}-go-build-cache-${{ hashFiles('**/go.sum') }}
      - name: inject go-build-cache into docker
        if: ${{ inputs.go-cache || inputs.language-cache == 'go' }}
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: |
            {
              "go-build-cache": "/root/.cache/go-build"
            }
          skip-extraction: ${{ steps.cache-go.outputs.cache-hit }}
      - name: Node Build Cache for Docker
        id: cache-node
        if: ${{ inputs.language-cache == 'javascript' }}
        uses: actions/cache@v6.1.0
        with:
          path: |
            node-arm64-cache
            node-amd64-cache
          key: ${{ runner.os }}-node-build-cache-${{ hashFiles('**/yarn.lock') }}
      - name: inject node-build-cache into docker
        if: ${{ inputs.language-cache == 'javascript' }}
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: |
            {
              "node-arm64-cache": "/root/.cache/yarn-arm64",
              "node-amd64-cache": "/root/.cache/yarn-amd64"
            }
          skip-extraction: ${{ steps.cache-node.outputs.cache-hit }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Validate Docker Hub credentials
        run: |
          if { [ -n "$DOCKER_USER" ] && [ -z "$DOCKER_PASSWORD" ]; } || { [ -z "$DOCKER_USER" ] && [ -n "$DOCKER_PASSWORD" ]; }; then
            echo "DOCKER_USER and DOCKER_PASSWORD must be provided together" >&2
            exit 1
          fi
      - name: Login to Docker Hub
        if: env.DOCKER_USER != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.docker-file }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: ${{ inputs.image-sbom || inputs.sbom-scan-stage }}
          provenance: ${{ inputs.provenance && 'mode=max' || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true
          secrets: |
            GH_TOKEN=${{ steps.generate-token.outputs.token }}
          build-args: |
            GIT_REV=${{fromJson(steps.meta.outputs.json).labels['org.opencontainers.image.revision']}}
            GIT_VERSION=${{fromJson(steps.meta.outputs.json).labels['org.opencontainers.image.version']}}
            GIT_URL=${{fromJson(steps.meta.outputs.json).labels['org.opencontainers.image.source']}}
            BUILD_DATE=${{fromJson(steps.meta.outputs.json).labels['org.opencontainers.image.created']}}
            BUILDKIT_SBOM_SCAN_STAGE=${{ inputs.sbom-scan-stage }}
            BUILDKIT_SBOM_SCAN_CONTEXT=${{ inputs.sbom-scan-context }}
      - name: Set image reference
        id: image-name
        run: |
          echo "name=ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name || github.event.repository.name }}" >> "$GITHUB_OUTPUT"
      - name: Set image reference
        id: image-ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            image_ref=$(printf '%s\n' "$IMAGE_TAGS" | sed -n '1p')
            test -n "$image_ref"
            echo "ref=$image_ref" >> "$GITHUB_OUTPUT"
            echo "Using mutable PR image reference: $image_ref"
            exit 0
          fi

          test -n "$IMAGE_DIGEST"
          echo "ref=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE_NAME}@${IMAGE_DIGEST}" --format '{{json .}}' > image-index.json
          test -s image-index.json
          echo "Published image: ${IMAGE_NAME}@${IMAGE_DIGEST}"
      - name: Set image attachment reference
        id: image-attachment-ref
        env:
          IMAGE_NAME: ${{ steps.image-name.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          echo "ref=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Install ORAS
        if: ${{ inputs.image-sbom || inputs.sbom-scan-stage || (inputs.vex-attestation && hashFiles(inputs.vex-path) != '') }}
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Attach OCI SBOM referrer
        if: ${{ inputs.image-sbom || inputs.sbom-scan-stage }}
        env:
          IMAGE_REF: ${{ steps.image-ref.outputs.ref }}
          IMAGE_ATTACHMENT_REF: ${{ steps.image-attachment-ref.outputs.ref }}
        run: |
          set -euo pipefail

          docker buildx imagetools inspect "$IMAGE_REF" \
            --format '{{json .SBOM}}' > image-sboms.json
          test -s image-sboms.json
          jq -e '
            to_entries
            | map(.value | [.SPDX, (.AdditionalSPDXs // [])[]?])
            | add
            | length > 0
          ' image-sboms.json > /dev/null

          jq --arg image_ref "$IMAGE_REF" '
            to_entries
            | map(.value | [.SPDX, (.AdditionalSPDXs // [])[]?])
            | add
            | {
                SPDXID: "SPDXRef-DOCUMENT",
                spdxVersion: "SPDX-2.3",
                dataLicense: "CC0-1.0",
                name: ($image_ref + " SBOM"),
                documentNamespace: ("urn:oci:sbom:" + ($image_ref | gsub("[^A-Za-z0-9.-]"; "-"))),
                creationInfo: {
                  created: (now | todateiso8601),
                  creators: ["Tool: github-workflows/docker.yaml"]
                },
                packages: (
                  map(.packages // [])
                  | add
                  | unique_by([.name, .versionInfo])
                ),
                files: [],
                relationships: []
              }
          ' image-sboms.json > image-sbom.spdx.json

          test -s image-sbom.spdx.json
          oras attach \
            --artifact-type application/spdx+json \
            --annotation 'org.opencontainers.image.title=Consolidated image SBOM' \
            "$IMAGE_ATTACHMENT_REF" \
            image-sbom.spdx.json:application/spdx+json

      - name: Attach unsigned OpenVEX referrer
        id: attach-vex
        if: ${{ inputs.vex-attestation && hashFiles(inputs.vex-path) != '' }}
        env:
          IMAGE_ATTACHMENT_REF: ${{ steps.image-attachment-ref.outputs.ref }}
          VEX_PATH: ${{ inputs.vex-path }}
        run: |
          set -euo pipefail
          jq empty "$VEX_PATH"
          image_name="${IMAGE_ATTACHMENT_REF%@*}"
          image_digest="${IMAGE_ATTACHMENT_REF##*@}"
          test -n "$image_name"
          test "$image_digest" != "$IMAGE_ATTACHMENT_REF"

          jq -n \
            --arg subject_name "$image_name" \
            --arg digest "${image_digest#sha256:}" \
            --slurpfile predicate "$VEX_PATH" \
            '{
              _type: "https://in-toto.io/Statement/v1",
              subject: [{name: $subject_name, digest: {sha256: $digest}}],
              predicateType: "https://openvex.dev/ns/v0.2.0",
              predicate: $predicate[0]
            }' > "$VEX_PATH.in-toto.json"

          oras attach \
            --artifact-type application/vnd.in-toto+json \
            --annotation 'in-toto.io/predicate-type=https://openvex.dev/ns/v0.2.0' \
            "$IMAGE_ATTACHMENT_REF" \
            "$VEX_PATH.in-toto.json:application/vnd.in-toto+json"
      - name: Upload image manifest evidence
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: image-manifest-${{ github.run_id }}
          path: image-index.json
          if-no-files-found: error
  vulnerability:
    if: ${{ inputs.vulnerability-scan}}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout VEX document for build-stage scanning
        if: ${{ inputs.sbom-scan-stage && needs.build.outputs.vex-attached == 'true' }}
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: ${{ inputs.vex-path }}
          sparse-checkout-cone-mode: false
      - name: Trivy vulnerability scanner report
        # trivy-action v0.35.0 (safe version) - pinned to full commit SHA
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.73.0
          scan-type: image
          image-ref: ${{ needs.build.outputs.image-ref }}
          scanners: vuln
          format: json
          output: trivy-image-vulnerability.json
          exit-code: "0"
          severity: MEDIUM,HIGH,CRITICAL
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_VEX: ${{ needs.build.outputs.vex-attached == 'true' && 'oci' || '' }}
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true
      - name: Add build-stage vulnerability findings
        if: ${{ inputs.sbom-scan-stage }}
        shell: bash
        env:
          IMAGE_REF: ${{ needs.build.outputs.image-ref }}
          VEX_PATH: ${{ needs.build.outputs.vex-attached == 'true' && inputs.vex-path || '' }}
        run: |
          set -euo pipefail

          docker buildx imagetools inspect "$IMAGE_REF" \
            --format '{{json .SBOM}}' > image-sboms.json

          mkdir -p build-stage-sboms build-stage-vulnerability
          stage_count=0
          while IFS=$'\t' read -r platform index; do
            stage_count=$((stage_count + 1))
            platform_path="${platform//\//-}"
            sbom_path="build-stage-sboms/${platform_path}-${index}.spdx.json"
            report_path="build-stage-vulnerability/${platform_path}-${index}.json"

            jq --arg platform "$platform" --argjson index "$index" \
              '.[$platform].AdditionalSPDXs[$index]' image-sboms.json > "$sbom_path"
            vex_args=()
            if [[ -n "$VEX_PATH" ]]; then
              test -f "$VEX_PATH"
              vex_args=(--vex "$VEX_PATH")
            fi
            trivy sbom --scanners vuln --severity MEDIUM,HIGH,CRITICAL \
              --format json --output "$report_path" "${vex_args[@]}" "$sbom_path"
            jq --arg platform "$platform" \
              '.Results = ((.Results // []) | map(.Target = "build-stage-sbom:" + $platform + ":" + .Target))' \
              "$report_path" > "${report_path}.tmp"
            mv "${report_path}.tmp" "$report_path"
          done < <(
            jq -r '
              to_entries[]
              | .key as $platform
              | (.value.AdditionalSPDXs // [])
              | to_entries[]
              | [$platform, (.key | tostring)]
              | @tsv
            ' image-sboms.json
          )

          if [[ "$stage_count" -eq 0 ]]; then
            echo "No BuildKit build-stage SBOMs were attached to $IMAGE_REF"
            exit 0
          fi

          jq -s '
            .[0] as $runtime
            | reduce .[1:][] as $build_stage (
                $runtime;
                .Results = ((.Results // []) + ($build_stage.Results // []))
              )
          ' trivy-image-vulnerability.json build-stage-vulnerability/*.json \
            > trivy-image-vulnerability.json.tmp
          mv trivy-image-vulnerability.json.tmp trivy-image-vulnerability.json
      - name: Upload image vulnerability evidence
        uses: actions/upload-artifact@v7
        with:
          name: image-vulnerability-${{ github.run_id }}
          path: trivy-image-vulnerability.json
          if-no-files-found: error
      - name: Enforce image vulnerability threshold
        if: ${{ inputs.fail-on-vulnerability }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ needs.build.outputs.image-ref }}
          scanners: "vuln,secret,misconfig"
          exit-code: "1"
          severity: MEDIUM,HIGH,CRITICAL
          skip-setup-trivy: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_VEX: ${{ needs.build.outputs.vex-attached == 'true' && 'oci' || '' }}
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true
      - name: Enforce build-stage vulnerability threshold
        if: ${{ inputs.sbom-scan-stage && inputs.fail-on-vulnerability }}
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          reports=(build-stage-vulnerability/*.json)
          if [[ "${#reports[@]}" -eq 0 ]]; then
            echo "No BuildKit build-stage SBOMs were attached; no build-stage threshold to enforce"
            exit 0
          fi

          echo "Build-stage Trivy vulnerability summary:"
          jq -s '
            [ .[] | .Results[]? as $result
              | ($result.Vulnerabilities // [])[]
              | {
                  class: ($result.Class // null),
                  type: ($result.Type // null),
                  vulnerability: .
                }
            ]
            | group_by([.class, .type])
            | {
                Results: map({
                  Target: "build-stage-sbom:all-platforms",
                  Class: .[0].class,
                  Type: .[0].type,
                  Vulnerabilities: (
                    map(.vulnerability)
                    | unique_by([
                        .VulnerabilityID,
                        .PkgName,
                        .InstalledVersion,
                        .FixedVersion,
                        .Status
                      ])
                  )
                })
              }
          ' "${reports[@]}" > build-stage-vulnerability-summary.json

          if jq -e '[.Results[]?.Vulnerabilities[]?] | length > 0' \
            build-stage-vulnerability-summary.json >/dev/null; then
            trivy convert \
              --format table \
              --report all \
              --scanners vuln \
              --severity MEDIUM,HIGH,CRITICAL \
              build-stage-vulnerability-summary.json
          else
            echo "No build-stage vulnerabilities found"
          fi

          jq -s -e '
            [ .[] | .Results[]?.Vulnerabilities[]? ] | length == 0
          ' "${reports[@]}" > /dev/null
