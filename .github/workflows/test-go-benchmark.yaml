name: Go benchmark workflow tests

on:
  pull_request:
    paths:
      - .github/workflows/golang.yaml
      - .github/workflows/test-go-benchmark.yaml
      - __tests__/test_go_benchmark.py
  push:
    branches: [main]
    paths:
      - .github/workflows/golang.yaml
      - .github/workflows/test-go-benchmark.yaml
      - __tests__/test_go_benchmark.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s __tests__ -p test_go_benchmark.py -v
